server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side (Browser) routing — any path that isn't a real
    # file must fall back to index.html so deep links (e.g. /dashboard) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
